name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: summary
    attributes: {label: What happened?, description: Include expected behavior and a minimal reproduction.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: jsmap-pro version and Go version}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs or report excerpt}
    validations: {required: false}
