version: 2
project_name: jsmap-pro
builds:
  - id: jsmap-pro
    main: .
    binary: jsmap
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: [-s -w]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, README.id.md, LICENSE, CHANGELOG.md, install.sh]
checksum:
  name_template: checksums.txt
